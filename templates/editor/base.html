{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <meta name="theme-color" content="#f3f0e9">
    <title>{% block title %}Редакционный стол — Dear Editors{% endblock %}</title>
    <link rel="icon" href="{% static 'news/favicon.svg' %}" type="image/svg+xml">
    <link rel="manifest" href="{% static 'news/icons/site.webmanifest' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'news/editor.css' %}">
    <link rel="stylesheet" href="{% static 'news/editor-toolbar.css' %}">
    <link rel="stylesheet" href="{% static 'news/editor-invites.css' %}">
    <script src="{% static 'news/editor.js' %}" defer></script>
</head>
<body>
<header class="wrap masthead">
    <div class="masthead__left">
        <a class="nameplate" href="{% url 'editor-dashboard' %}">Dear Editors</a>
        <span class="masthead__desk">Редакционный стол</span>
    </div>
    <nav class="masthead__nav">
        <a href="{% url 'editor-inbox' %}">Почта редакции</a>
        <a href="{% url 'editor-invitations' %}">Приглашения</a>
        <a href="{% url 'article-list' %}" target="_blank">Открыть издание ↗</a>
        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button class="nav-link" type="submit">Выйти</button>
        </form>
    </nav>
</header>

<main class="wrap {% block main_class %}{% endblock %}">
    {% if messages %}
        <div class="flash">
            {% for message in messages %}<p>{{ message }}</p>{% endfor %}
        </div>
    {% endif %}
    {% block content %}{% endblock %}
</main>
</body>
</html>
