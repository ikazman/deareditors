{% load editorial_markdown %}
<div class="article__byline">
    <span class="stamp">{{ article.published_at|date:"d.m.Y" }}</span>
    {% if article.rubric %}
        <span class="stamp" aria-hidden="true">·</span>
        <span class="desk">{{ article.rubric }}</span>
    {% else %}
        <span class="desk">{{ article.author_name }}</span>
    {% endif %}
</div>

<h1 class="article__title">{{ article.title }}</h1>

{% if article.lead %}<p class="article__lead">{{ article.lead }}</p>{% endif %}

<hr class="article__rule">

<div class="article__body">{{ article|editorial_article }}</div>
<p class="article__signoff">Будем наблюдать.</p>
