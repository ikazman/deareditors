{% if menu %}
<article class="entry entry--menu">
    <div class="byline">
        <span class="stamp">{{ menu.menu_date|date:"j E Y" }}</span>
        <span class="desk">Меню дня</span>
    </div>
    <h2><a href="{{ menu.get_absolute_url }}">{{ menu.display_title }}</a></h2>
    <p>{{ menu.display_lead }}</p>
    <a class="more more--nav" href="{{ menu.get_absolute_url }}">Выбрать обед</a>
</article>
{% endif %}
